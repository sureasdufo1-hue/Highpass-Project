name: Staging Validation

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      allow_blocked:
        description: "Allow BLOCKED result when external staging resources are intentionally unavailable"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  staging-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run staging smoke test
        env:
          HIPASS_STAGING_ALLOW_BLOCKED: ${{ inputs.allow_blocked == 'true' && '1' || '0' }}
          HIPASS_ENV: staging
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          STAGING_HEALTH_PATH: ${{ vars.STAGING_HEALTH_PATH }}
          STAGING_READINESS_PATH: ${{ vars.STAGING_READINESS_PATH }}
          OIDC_DISCOVERY_URL: ${{ vars.OIDC_DISCOVERY_URL }}
          JWT_ISSUER: ${{ vars.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ vars.JWT_AUDIENCE }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DB_SSLMODE: ${{ vars.STAGING_DB_SSLMODE }}
          STAGING_DB_CA_FILE: ${{ vars.STAGING_DB_CA_FILE }}
          STAGING_SECRET_CHECK_COMMAND_JSON: ${{ vars.STAGING_SECRET_CHECK_COMMAND_JSON }}
          STAGING_SECRET_ROTATION_CHECK_COMMAND_JSON: ${{ vars.STAGING_SECRET_ROTATION_CHECK_COMMAND_JSON }}
          STAGING_KMS_CHECK_COMMAND_JSON: ${{ vars.STAGING_KMS_CHECK_COMMAND_JSON }}
          STAGING_OIDC_TEST_TOKEN_COMMAND_JSON: ${{ vars.STAGING_OIDC_TEST_TOKEN_COMMAND_JSON }}
          STAGING_REGISTRY_DIGEST_COMMAND_JSON: ${{ vars.STAGING_REGISTRY_DIGEST_COMMAND_JSON }}
          STAGING_RUNTIME_DIGEST_COMMAND_JSON: ${{ vars.STAGING_RUNTIME_DIGEST_COMMAND_JSON }}
          STAGING_NOTIFICATION_CHECK_COMMAND_JSON: ${{ vars.STAGING_NOTIFICATION_CHECK_COMMAND_JSON }}
          STAGING_DR_CHECK_COMMAND_JSON: ${{ vars.STAGING_DR_CHECK_COMMAND_JSON }}
          STAGING_BROWSER_TRACE_COMMAND_JSON: ${{ vars.STAGING_BROWSER_TRACE_COMMAND_JSON }}
          STAGING_MTLS_CHECK_COMMAND_JSON: ${{ vars.STAGING_MTLS_CHECK_COMMAND_JSON }}
        run: pnpm run staging:smoke
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: level-7-staging-smoke
          path: artifacts/level-7/
          if-no-files-found: ignore
