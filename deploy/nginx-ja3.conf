# HiPass Platform - Production Ingress Nginx Configuration with JA3 Fingerprinting
# Reference Architecture: Terminate/Preread TLS & Forward x-ja3-fingerprint to Control Plane

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format including TLS parameters
    log_format hipass_combined '$remote_addr - $remote_user [$time_local] "$request" '
                                '$status $body_bytes_sent "$http_referer" '
                                '"$http_user_agent" "$http_x_forwarded_for" '
                                'ja3="$http_x_ja3_fingerprint" ssl_proto="$ssl_protocol" '
                                'ssl_cipher="$ssl_cipher"';

    access_log /var/log/nginx/access.log hipass_combined;

    upstream hipass_backend {
        server control-plane:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 443 ssl http2;
        server_name hipass.hospital.internal;

        # TLS Hardened Parameters (mTLS / TLS 1.2 & 1.3 only)
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:;" always;

        location / {
            proxy_pass http://hipass_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Inject TLS Client Fingerprint (Provided via OpenSSL / Nginx JA3 Module or Lua)
            # If compiled with lua-nginx-module and lua-resty-ja3:
            # set_by_lua_block $ja3_hash { return require("resty.ja3").get_ja3() }
            # proxy_set_header X-JA3-Fingerprint $ja3_hash;

            # Standard Forwarded SSL Attributes
            proxy_set_header X-SSL-Protocol $ssl_protocol;
            proxy_set_header X-SSL-Cipher $ssl_cipher;
            proxy_set_header X-SSL-Client-Verify $ssl_client_verify;

            # Buffer & Timeout Constraints
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
