server {
  listen 8443 ssl;
  server_name hospital-a-orthanc-mtls;

  ssl_certificate /etc/nginx/mtls/orthanc-server.crt;
  ssl_certificate_key /etc/nginx/mtls/orthanc-server.key;
  ssl_client_certificate /etc/nginx/mtls/ca.crt;
  ssl_verify_client on;
  ssl_verify_depth 2;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  location / {
    proxy_pass http://hospital-a-orthanc:8042;
    proxy_set_header Host hospital-a-orthanc;
    proxy_set_header X-Forwarded-Proto https;
  }
}
