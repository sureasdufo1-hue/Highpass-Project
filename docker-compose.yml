services:
  hipass-control-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hipass-control-api
    environment:
      PORT: ${PORT:-3000}
      HIPASS_STORE: postgres
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your environment or .env file}
      DICOM_TOKEN_SECRET: ${DICOM_TOKEN_SECRET:?Set DICOM_TOKEN_SECRET in your environment or .env file}
      DICOM_TOKEN_TTL_MINUTES: ${DICOM_TOKEN_TTL_MINUTES:-5}
      ORTHANC_REST_URL: http://hospital-a-orthanc:8042
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      hospital-a-orthanc:
        condition: service_healthy
      hospital-a-orthanc-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  hospital-a-orthanc:
    image: jodogne/orthanc-plugins:1.12.11
    container_name: hospital-a-orthanc
    command: /etc/orthanc
    expose:
      - "8042"
    volumes:
      - ./orthanc/hospital-a.json:/etc/orthanc/orthanc.json:ro
      - hospital-a-orthanc-data:/var/lib/orthanc/db
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8042/system || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  hospital-a-orthanc-seed:
    image: newproject-hipass-control-api
    container_name: hospital-a-orthanc-seed
    command: ["node", "scripts/load-sample-dicom.js"]
    environment:
      ORTHANC_REST_URL: http://hospital-a-orthanc:8042
    depends_on:
      hospital-a-orthanc:
        condition: service_healthy
    restart: "no"

  hospital-b-viewer:
    image: ohif/app:v3.9.2
    container_name: hospital-b-viewer
    ports:
      - "3001:80"
    volumes:
      - ./ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro
    depends_on:
      hospital-a-orthanc:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: hipass-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in your environment or .env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in your environment or .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}
    ports:
      - "5432:5432"
    volumes:
      - hipass-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  hipass-postgres-data:
  hospital-a-orthanc-data:
