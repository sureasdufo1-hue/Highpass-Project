            allowedActions: {type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: {$ref: '#/components/schemas/AccessAction'}}
            resources: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/ResourceScope'}}
            policyVersion: {type: string, minLength: 1, maxLength: 64}
            evidenceDigest: {type: string, minLength: 43, maxLength: 128}
            state: {$ref: '#/components/schemas/ConsentState'}
            validFrom: {$ref: '#/components/schemas/Timestamp'}
