    CreateConsentArtifactRequest:
      type: object
      description: 'TARGET ONLY: submitted state/evidenceDigest are untrusted and do not prove patient approval. Separate PENDING preparation from a server-verified approval command before activation. D1-D4 policy proposals and D5 sequencing were user-adopted 2026-10-08; D6 verification and durable approval remain incomplete. This schema is not a deployed approval command.'
