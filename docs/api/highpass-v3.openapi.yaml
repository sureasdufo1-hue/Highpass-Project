openapi: 3.1.0
info:
  title: Highpass v3 Control Plane API
  version: 3.0.0-draft-alignment
  summary: Target contract for patient-controlled medical imaging exchange
  description: |
    TARGET CONTRACT, NOT ACTIVATED IN THE EXISTING SERVER. The metadata GET handler
    has local PostgreSQL/loopback HTTP tests. Mapping write/review services have
    local PostgreSQL tests, but their HTTP handlers remain target contracts.
    Existing Mobile-Core and DICOMweb contracts remain the implementation baseline
    until the additive migration and acceptance gates are approved.
    CAPSTONE MVP / TECHNICAL TEST ENVIRONMENT ONLY.
servers:
  - url: https://localhost:8443/api/v3
    description: Local technical test environment
x-highpass-lifecycle-alignment:
  status: DRAFT-PROPOSAL-NOT-ACTIVATED
  contract: docs/api/highpass-v3-lifecycle-dependency-contract.md
  unresolvedDecisions: [D1, D2, D3, D4, D5, D6]
tags:
  - name: PatientMapping
  - name: ExchangeSession
  - name: Authorization
  - name: TransferGrant
  - name: ImagingPackage
  - name: Route
  - name: Preflight
  - name: Access
  - name: Provenance
  - name: Audit
paths:
  /patient-mappings/reconcile:
    post:
      operationId: reconcilePatientMapping
      x-implementation-status: LOCAL-WRITE-HTTP-PG-TESTED-NOT-ACTIVATED
      tags: [PatientMapping]
      summary: Reconcile a tenant-local patient reference
      security:
        - oauth2: [mapping:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AuditSessionId'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcilePatientMappingRequest'
      responses:
        '201':
          description: Mapping created or the idempotent result returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientMapping'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/Problem'
  /patient-mappings/{mappingId}:
    get:
      x-implementation-status: LOCAL-HANDLER-TESTED-NOT-ACTIVATED
      operationId: getPatientMapping
      tags: [PatientMapping]
      security:
        - oauth2: [mapping:read]
      parameters:
        - $ref: '#/components/parameters/MappingId'
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: Mapping metadata without local patient identifiers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientMapping'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /patient-mappings/{mappingId}/reviews:
    post:
      operationId: reviewPatientMapping
      tags: [PatientMapping]
      summary: Record a version-checked own-hospital mapping review
      x-implementation-status: LOCAL-WRITE-HTTP-PG-TESTED-NOT-ACTIVATED
      description: |
        Own-hospital HOSPITAL_ADMIN or SECURITY_ADMIN with mapping:review.
        Evidence digest alone does not authorize verification. Actor and scope come
        from server-owned binding. Local service transaction/audit/idempotency tested;
        HTTP activation, real reviewer delegation and cross-hospital ref linking pending.
      security:
        - oauth2: [mapping:review]
      parameters:
        - $ref: '#/components/parameters/MappingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AuditSessionId'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewPatientMappingRequest'
      responses:
        '200':
          description: Reviewed metadata, or original idempotent result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientMapping'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/Problem'
  /exchange-sessions:
    post:
      operationId: createExchangeSession
      x-implementation-status: ISOLATED-HTTP-PG-TESTED-NOT-RUNTIME-ACTIVATED
      x-input-validation-status: LOCAL-CONTRACT-TESTED-NOT-ACTIVATED
      tags: [ExchangeSession]
      security:
        - oauth2: [exchange:create]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AuditSessionId'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExchangeSessionRequest'
      responses:
        '201':
          description: Exchange session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeSession'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/Problem'
  /exchange-sessions/{sessionId}:
    get:
      operationId: getExchangeSession
      x-implementation-status: ISOLATED-HTTP-PG-TESTED-NOT-RUNTIME-ACTIVATED
      tags: [ExchangeSession]
      security:
        - oauth2: [exchange:read]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: Exchange session visible to an authorized participant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeSession'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /exchange-sessions/{sessionId}/cancel:
    post:
      operationId: cancelExchangeSession
      x-implementation-status: REQUESTED-CANCEL-ISOLATED-HTTP-PG-TESTED-NOT-RUNTIME-ACTIVATED
      tags: [ExchangeSession]
      security:
        - oauth2: [exchange:cancel]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/AuditSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSessionRequest'
      responses:
        '200':
          description: Session cancelled and durable cascade request enqueued. Current isolated REQUESTED-only implementation does not attest downstream Grant revocation or work cancellation delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeSession'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Problem'
  /exchange-sessions/{sessionId}/consent-artifacts:
    post:
      operationId: attachConsentArtifact
      tags: [Authorization]
      security:
        - oauth2: [consent:write]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AuditSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsentArtifactRequest'
      responses:
        '201':
          description: Consent evidence attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentArtifact'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/Problem'
  /exchange-sessions/{sessionId}/authorization-decisions:
    post:
      operationId: evaluateAuthorization
      tags: [Authorization]
      security:
        - oauth2: [authorization:evaluate]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AuditSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateAuthorizationRequest'
      responses:
        '201':
          description: Immutable authorization decision, including DENY
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationDecision'
        default:
          $ref: '#/components/responses/Problem'
  /exchange-sessions/{sessionId}/transfer-grants:
    post:
      operationId: issueTransferGrant
      tags: [TransferGrant]
      summary: Issue a short-lived, recipient and resource scoped grant after ALLOW
      security:
        - oauth2: [grant:issue]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AuditSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTransferGrantRequest'
      responses:
        '201':
          description: Grant and one-time bearer material; bearer material is never returned by GET
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedTransferGrant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'
  /transfer-grants/{grantId}:
    get:
      operationId: getTransferGrant
      tags: [TransferGrant]
      security:
        - oauth2: [grant:read]
      parameters:
        - $ref: '#/components/parameters/GrantId'
      responses:
        '200':
          description: Grant metadata only; no token or key material
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferGrant'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /exchange-sessions/{sessionId}/imaging-packages:
    post:
      operationId: createImagingPackage
      tags: [ImagingPackage]
      security:
        - oauth2: [package:create]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AuditSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImagingPackageRequest'
      responses:
        '201':
          description: Route-neutral imaging package manifest created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagingPackage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/Problem'
  /imaging-packages/{packageId}:
    get:
      operationId: getImagingPackage
      tags: [ImagingPackage]
      security:
        - oauth2: [package:read]
      parameters:
        - $ref: '#/components/parameters/PackageId'
      responses:
        '200':
          description: Manifest metadata, not DICOM binary payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagingPackage'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /exchange-sessions/{sessionId}/route-decisions:
    post:
      operationId: decideExchangeRoute
      tags: [Route]
      security:
        - oauth2: [route:decide]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AuditSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRouteDecisionRequest'
      responses:
        '201':
          description: Route decision with capability snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDecision'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/Problem'
  /exchange-sessions/{sessionId}/preflight-results:
    post:
      operationId: executePreflight
      tags: [Preflight]
      description: Executes checks only. It must not move DICOM payloads or invoke PACS import.
      security:
        - oauth2: [preflight:execute]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AuditSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutePreflightRequest'
      responses:
        '201':
          description: Immutable preflight evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreflightResult'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Problem'
  /preflight-results/{preflightId}:
    get:
      operationId: getPreflightResult
      tags: [Preflight]
      security:
        - oauth2: [preflight:read]
      parameters:
        - $ref: '#/components/parameters/PreflightId'
      responses:
        '200':
          description: Preflight evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreflightResult'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /exchange-sessions/{sessionId}/viewer-sessions:
    post:
      operationId: createViewerSession
      tags: [Access]
      security:
        - oauth2: [dicom:view]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AuditSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessRequest'
      responses:
        '201':
          description: Short-lived viewer session; no bearer token in URL
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerSession'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
  /exchange-sessions/{sessionId}/downloads:
    post:
      operationId: startDownload
      tags: [Access]
      security:
        - oauth2: [dicom:download]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AuditSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessRequest'
      responses:
        '202':
          description: Authorized download job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedJob'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
  /exchange-sessions/{sessionId}/pacs-imports:
    post:
      operationId: createPacsImport
      tags: [Access]
      description: Requires a VERIFIED patient mapping, PASS preflight, valid IMPORT grant, and mTLS connector.
      security:
        - mutualTLS: []
          oauth2: [dicom:import]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AuditSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePacsImportRequest'
      responses:
        '202':
          description: Import accepted after all preconditions passed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacsImport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Problem'
  /pacs-imports/{importId}:
    get:
      operationId: getPacsImport
      tags: [Access]
      security:
        - oauth2: [dicom:import]
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: PACS import status without connector secrets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacsImport'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /provenance/{provenanceId}:
    get:
      operationId: getProvenance
      tags: [Provenance]
      security:
        - oauth2: [provenance:read]
      parameters:
        - $ref: '#/components/parameters/ProvenanceId'
      responses:
        '200':
          description: Chain-of-custody metadata without clinical payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provenance'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /exchange-sessions/{sessionId}/audit-events:
    get:
      operationId: listExchangeAuditEvents
      tags: [Audit]
      security:
        - oauth2: [audit:read]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Redacted, cursor-paginated audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://idp.example.invalid/oauth2/authorize
          tokenUrl: https://idp.example.invalid/oauth2/token
          scopes:
            mapping:write: Reconcile patient mappings
            mapping:read: Read mapping status
            mapping:review: Review own-hospital patient mapping with evidence and version
            exchange:create: Create exchange sessions
            exchange:read: Read exchange sessions
            exchange:cancel: Cancel exchange sessions
            consent:write: Attach consent evidence
            authorization:evaluate: Evaluate access policy
            grant:issue: Issue transfer grants
            grant:read: Read transfer grant metadata
            package:create: Create imaging package manifests
            package:read: Read imaging package metadata
            route:decide: Create route decisions
            preflight:execute: Execute preflight checks
            preflight:read: Read preflight results
            dicom:view: Open approved viewer sessions
            dicom:download: Start approved downloads
            dicom:import: Import an approved package into PACS
            provenance:read: Read provenance evidence
            audit:read: Read redacted audit events
    mutualTLS:
      type: mutualTLS
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
    AuditSessionId:
      name: X-Audit-Session-Id
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      schema: {type: string, minLength: 16, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    MappingId: {name: mappingId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    SessionId: {name: sessionId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    GrantId: {name: grantId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    PackageId: {name: packageId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    PreflightId: {name: preflightId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    ImportId: {name: importId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    ProvenanceId: {name: provenanceId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, maxLength: 512}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
  responses:
    Problem:
      description: Safe error response
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Authenticated but not authorized; denial is audited
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource not found or intentionally undisclosed
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Idempotency conflict or invalid state transition
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionFailed:
      description: If-Match version does not match
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unprocessable:
      description: Semantically invalid request or unmet domain precondition
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ServiceUnavailable:
      description: Explicit dependency, connector, network, or readiness failure
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Uuid: {type: string, format: uuid}
    Timestamp: {type: string, format: date-time}
    DicomUid: {type: string, minLength: 1, maxLength: 64, pattern: '^[0-9]+(\.[0-9]+)*$'}
    MappingState: {type: string, enum: [NO_MATCH, MULTIPLE_MATCH, IDENTITY_CONFLICT, UNVERIFIED, VERIFIED]}
    ExchangeState: {type: string, enum: [REQUESTED, IDENTITY_PENDING, CONSENT_PENDING, CONSENTED, AUTHORIZED, PREFLIGHT, READY, ACTIVE, VIEWING, DOWNLOADING, TRANSFERRING, MOBILE_EXPORTING, COMPLETED, REJECTED, EXPIRED, REVOKED, FAILED, CANCELLED]}
    ConsentState: {type: string, enum: [PENDING, ACTIVE, REJECTED, WITHDRAWN, EXPIRED]}
    InitiationType: {type: string, enum: [PATIENT_INITIATED, PROVIDER_INITIATED]}
    AccessAction: {type: string, enum: ['study:view', 'study:download', 'study:pacs-transfer', 'study:mobile-export']}
    RouteType: {type: string, enum: [PACS_DIRECT, CLOUD_VIEW, CLOUD_DOWNLOAD, CLOUD_RELAY, MOBILE_VAULT]}
    PreflightOverall: {type: string, enum: [PASS, WARNING, FAIL]}
    GrantStatus: {type: string, enum: [ISSUED, ACTIVE, CONSUMED, EXPIRED, REVOKED]}
    IntegrityStatus: {type: string, enum: [PENDING, PASS, FAIL, NOT_VERIFIED]}
    DecisionOutcome: {type: string, enum: [ALLOW, DENY]}
    ResourceScope:
      type: object
      additionalProperties: false
      required: [studyInstanceUid]
      properties:
        studyInstanceUid: {$ref: '#/components/schemas/DicomUid'}
        seriesInstanceUids:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          description: Omit for explicit whole-Study selection; empty array is invalid, never interpreted as all Series.
          items: {$ref: '#/components/schemas/DicomUid'}
    ReconcilePatientMappingRequest:
      type: object
      additionalProperties: false
      required: [patientRefId, tenantId, hospitalId, protectedLocalRef, localRefDigest]
      properties:
        patientRefId: {$ref: '#/components/schemas/Uuid'}
        tenantId: {$ref: '#/components/schemas/Uuid'}
        hospitalId: {$ref: '#/components/schemas/Uuid'}
        protectedLocalRef: {type: string, minLength: 24, maxLength: 4096, pattern: '^[A-Za-z0-9_-]+$', description: 'Canonical base64url AES-256-GCM v1 envelope; bound to tenant/hospital/patientRef; server verifies tag and keyed digest before storage. See docs/security/highpass-v3-identifier-protection.md. Never returned or logged.'}
        localRefDigest: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]+$', description: 'Canonical base64url HMAC-SHA-256 over exact localRef and tenant/hospital; independently keyed and verified by server. Never returned or logged.'}
    ReviewPatientMappingRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, state, evidenceDigest]
      properties:
        expectedVersion: {type: integer, minimum: 1, maximum: 2147483646}
        state: {$ref: '#/components/schemas/MappingState'}
        evidenceDigest: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]+$', description: 'Canonical base64url SHA-256 evidence reference. No evidence text or raw patient identifiers.'}
    PatientMapping:
      type: object
      additionalProperties: false
      required: [mappingId, patientRefId, tenantId, hospitalId, state, version, createdAt, updatedAt]
      properties:
        mappingId: {$ref: '#/components/schemas/Uuid'}
        patientRefId: {$ref: '#/components/schemas/Uuid'}
        tenantId: {$ref: '#/components/schemas/Uuid'}
        hospitalId: {$ref: '#/components/schemas/Uuid'}
        state: {$ref: '#/components/schemas/MappingState'}
        verifiedAt: {$ref: '#/components/schemas/Timestamp'}
        version: {type: integer, minimum: 1}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    CreateExchangeSessionRequest:
      type: object
      description: Structural validation alone is not consent or authorization. Source/requester/owner must match the server principal; patient initiation requires its registered PatientRef. Finite expiry is bounded by server policy; timestamps use a valid calendar, UTC or numeric offset, and at most millisecond precision. Duplicate Study entries are rejected rather than merged.
      additionalProperties: false
      required: [patientRefId, ownerTenantId, sourceHospitalId, targetHospitalId, requesterId, purpose, initiationType, validUntil, resources, requestedActions]
      properties:
        patientRefId: {$ref: '#/components/schemas/Uuid'}
        ownerTenantId: {$ref: '#/components/schemas/Uuid'}
        sourceHospitalId: {$ref: '#/components/schemas/Uuid'}
        targetHospitalId: {$ref: '#/components/schemas/Uuid'}
        requesterId: {$ref: '#/components/schemas/Uuid'}
        purpose: {type: string, minLength: 2, maxLength: 64, pattern: '^[A-Z][A-Z0-9_]*$'}
        initiationType: {$ref: '#/components/schemas/InitiationType'}
        validUntil: {$ref: '#/components/schemas/Timestamp'}
        requestedActions:
          type: array
          description: Immutable request intention, not consent or a capability. Later allowed actions must be a subset of this selection and valid consent; no Grant is issued by Session creation.
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: {$ref: '#/components/schemas/AccessAction'}
        resources:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/ResourceScope'}
    ExchangeSession:
      type: object
      additionalProperties: false
      required: [sessionId, patientRefId, ownerTenantId, sourceHospitalId, targetHospitalId, requesterId, purpose, initiationType, state, validFrom, validUntil, resources, requestedActions, version, createdAt, updatedAt]
      properties:
        sessionId: {$ref: '#/components/schemas/Uuid'}
        patientRefId: {$ref: '#/components/schemas/Uuid'}
        ownerTenantId: {$ref: '#/components/schemas/Uuid'}
        sourceHospitalId: {$ref: '#/components/schemas/Uuid'}
        targetHospitalId: {$ref: '#/components/schemas/Uuid'}
        requesterId: {$ref: '#/components/schemas/Uuid'}
        purpose: {type: string, maxLength: 64}
        initiationType: {$ref: '#/components/schemas/InitiationType'}
        state: {$ref: '#/components/schemas/ExchangeState'}
        validFrom: {$ref: '#/components/schemas/Timestamp'}
        validUntil: {$ref: '#/components/schemas/Timestamp'}
        resources: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ResourceScope'}}
        requestedActions:
          type: array
          description: Immutable requested intention. Empty legacy selection means NOT CAPTURED, never default VIEW or implicit authorization; it cannot be used to derive a Grant.
          maxItems: 4
          uniqueItems: true
          items: {$ref: '#/components/schemas/AccessAction'}
        version: {type: integer, minimum: 1}
