gray)"/><foreignObject x="962.5" y="566" width="200" height="32"><xhtml:div style="font:12px 'Malgun Gothic',Arial;text-align:center;background:white;color:#172033;padding:2px">Audit</xhtml:div></foreignObject><path d="M1650,492.5 H1297.5 V667.5 H945" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/><foreignObject x="1197.5" y="566" width="200" height="32"><xhtml:div style="font:12px 'Malgun Gothic',Arial;text-align:center;background:white;color:#172033;padding:2px">Audit</xhtml:div></foreignObject><rect x="20" y="20" width="1870" height="55" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" /><foreignObject x="26" y="24" width="1858" height="47"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;white-space:pre-wrap;font:700 28px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">동의 · QR · 원격조회 · 선택적 PACS 편입 상세흐름</xhtml:div></foreignObject><rect x="30" y="120" width="420" height="205" rx="10" fill="#E8F1FB" stroke="#2563EB" stroke-width="2" /><foreignObject x="36" y="124" width="408" height="197"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;white-space:pre-wrap;font:700 15px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">1. A 병원 Study 선택

A Staff → A PACS
CT/MRI Study·Series 선택
원본은 A PACS 유지</xhtml:div></foreignObject><rect x="500" y="120" width="420" height="205" rx="10" fill="#E8F1FB" stroke="#2563EB" stroke-width="2" /><foreignObject x="506" y="124" width="408" height="197"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;white-space:pre-wrap;font:700 15px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">2. 환자 동의

Purpose · Recipient
Study/Series Scope · Validity
View / Import · Revocation</xhtml:div></foreignObject><rect x="970" y="120" width="420" height="205" rx="10" fill="#E8F1FB" stroke="#2563EB" stroke-width="2" /><foreignObject x="976" y="124" width="408" height="197"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;white-space:pre-wrap;font:700 15px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">3. QR / Ticket 발급

opaque ticket · jti/nonce
TTL · one-time · institution binding
no PII · no DICOM · no key</xhtml:div></foreignObject><rect x="1440" y="120" width="420" height="205" rx="10" fill="#E8F1FB" stroke="#2563EB" stroke-width="2" /><foreignObject x="1446" y="124" width="408" height="197"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;white-space:pre-wrap;font:700 15px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">4. B 의료진 인증

OIDC/OAuth + MFA
principal · organization 검증
QR만으로 인증하지 않음</xhtml:div></foreignObject><rect x="30" y="390" width="420" height="205" rx="10" fill="#FFF0DF" stroke="#D97706" stroke-width="2" /><foreignObject x="36" y="394" width="408" height="197"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;white-space:pre-wrap;font:700 15px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">5. QR 연결 · 정책 평가

RBAC + ABAC
기관·의료진·환자·Study·목적·기간
ALLOW / DENY / EXPIRED / REVOKED / CONSUMED</xhtml:div></foreignObject><rect x="500" y="390" width="420" height="205" rx="10" fill="#FFF0DF" stroke="#D97706" stroke-width="2" /><foreignObject x="506" y="394" width="408" height="197"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;white-space:pre-wrap;font:700 15px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">6. QIDO-RS 검색

B Viewer → B Connector
Approved Study Metadata
허용 Study/Series만 반환</xhtml:div></foreignObject><rect x="970" y="390" width="420" height="205" rx="10" fill="#FFF0DF" stroke="#D97706" stroke-width="2" /><foreignObject x="976" y="394" width="408" height="197"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;white-space:pre-wrap;font:700 15px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">7. WADO-RS 원격조회

B Viewer ↔ B Edge ↔ Relay ↔ A Edge ↔ A PACS
On-demand Retrieval · Progressive Loading
Instance / Multi-frame Frame · 생영상 Streaming 아님</xhtml:div></foreignObject><rect x="1440" y="390" width="420" height="205" rx="10" fill="#FFF0DF" stroke="#D97706" stroke-width="2" /><foreignObject x="1446" y="394" width="408" height="197"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;white-space:pre-wrap;font:700 15px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">8. 선택적 PACS 편입

Import Request → Separate Storage Policy
STOW-RS 또는 Legacy C-STORE
Manifest·UID·무결성·부분전송 검증</xhtml:div></foreignObject><rect x="30" y="630" width="1830" height="75" rx="10" fill="#E2E8F0" stroke="#475569" stroke-width="2" /><foreignObject x="36" y="634" width="1818" height="67"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;white-space:pre-wrap;font:700 14px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">Audit Service — Issue · Scan · Validate · Allow/Deny · QIDO · WADO · STOW/C-STORE · Revoke · Expire · Delete
actor principal · organization · patient reference · Study/Series · purpose · action · timestamp · result · correlation ID</xhtml:div></foreignObject><rect x="30" y="740" width="1830" height="230" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2" /><rect x="60" y="790" width="410" height="40" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2" /><foreignObject x="66" y="794" width="398" height="32"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;white-space:pre-wrap;font:400 12px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">QR 만료 → 접근 거부·새 요청</xhtml:div></foreignObject><rect x="505" y="790" width="410" height="40" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2" /><foreignObject x="511" y="794" width="398" height="32"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;white-space:pre-wrap;font:400 12px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">QR 재사용 → 보안 이벤트</xhtml:div></foreignObject><rect x="950" y="790" width="410" height="40" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2" /><foreignObject x="956" y="794" width="398" height="32"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;white-space:pre-wrap;font:400 12px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">타 기관 → binding 실패</xhtml:div></foreignObject><rect x="1395" y="790" width="410" height="40" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2" /><foreignObject x="1401" y="794" width="398" height="32"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;white-space:pre-wrap;font:400 12px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">타 Study → ABAC 거부</xhtml:div></foreignObject><rect x="60" y="845" width="410" height="40" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2" /><foreignObject x="66" y="849" width="398" height="32"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;white-space:pre-wrap;font:400 12px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">동의 철회 → 미래 접근 차단</xhtml:div></foreignObject><rect x="505" y="845" width="410" height="40" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2" /><foreignObject x="511" y="849" width="398" height="32"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;white-space:pre-wrap;font:400 12px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">의료진 미인증 → 영상 미제공</xhtml:div></foreignObject><rect x="950" y="845" width="410" height="40" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2" /><foreignObject x="956" y="849" width="398" height="32"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;white-space:pre-wrap;font:400 12px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">A PACS 장애 → 직접 우회 금지</xhtml:div></foreignObject><rect x="1395" y="845" width="410" height="40" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2" /><foreignObject x="1401" y="849" width="398" height="32"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;white-space:pre-wrap;font:400 12px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">B PACS 실패 → 편입 실패 기록</xhtml:div></foreignObject><rect x="60" y="900" width="410" height="40" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2" /><foreignObject x="66" y="904" width="398" height="32"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;white-space:pre-wrap;font:400 12px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">무결성 실패 → 복호화·편입 중지</xhtml:div></foreignObject><rect x="505" y="900" width="410" height="40" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2" /><foreignObject x="511" y="904" width="398" height="32"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;white-space:pre-wrap;font:400 12px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">인증서 만료 → mTLS 차단</xhtml:div></foreignObject><rect x="950" y="900" width="410" height="40" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2" /><foreignObject x="956" y="904" width="398" height="32"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;white-space:pre-wrap;font:400 12px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">캐시 TTL 초과 → 자동삭제·증적</xhtml:div></foreignObject><rect x="1395" y="900" width="410" height="40" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2" /><foreignObject x="1401" y="904" width="398" height="32"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;white-space:pre-wrap;font:400 12px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">감사 API 무권한 → 401/403</xhtml:div></foreignObject><rect x="30" y="990" width="1830" height="38" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" /><foreignObject x="36" y="994" width="1818" height="30"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;white-space:pre-wrap;font:400 12px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">범례  파란 실선=제어·동의·권한  |  주황 굵은선=DICOM·Pixel Data  |  회색 점선=감사·선택  |  빨간 영역=거부·장애  |  🔒 TLS 1.3 · mTLS · AES-256-GCM</xhtml:div></foreignObject><rect x="30" y="1035" width="1830" height="30" rx="10" fill="#FFF7ED" stroke="#B45309" stroke-width="2" /><foreignObject x="36" y="1039" width="1818" height="22"><xhtml:div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;white-space:pre-wrap;font:700 12px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px;box-sizing:border-box">A 병원 원본 유지 → 환자 동의·QR 발급 → B 의료진 인증 → 정책 승인 → QIDO-RS 검색 → WADO-RS 원격조회 → 필요 시 STOW-RS/C-STORE 편입 → 감사로그  |  캡스톤 PoC·합성 데이터</xhtml:div></foreignObject><foreignObject x="38" y="746" width="1814" height="58"><xhtml:div style="background:#FEF2F2;display:inline-block;text-align:left;white-space:pre-wrap;font:700 19px 'Malgun Gothic',Arial;color:#172033;line-height:1.25;padding:4px 6px;box-sizing:border-box">Security / Failure Cases — 모두 Fail Closed</xhtml:div></foreignObject></svg>